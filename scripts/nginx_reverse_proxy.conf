# Host-level Nginx reverse proxy for production deployment on EC2.
# Install with: sudo apt-get install -y nginx
# Save this file as /etc/nginx/sites-available/forensic-secure-storage
# Then: sudo ln -s /etc/nginx/sites-available/forensic-secure-storage /etc/nginx/sites-enabled/
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx
#
# Replace your-domain.com with your actual domain or EC2 public IP before use.
# After this is working over HTTP, run certbot to add HTTPS (see AWS_DEPLOYMENT.md).

server {
    listen 80;
    server_name your-domain.com;

    # Frontend (React static build served by the frontend container's Nginx)
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;   # allow large evidence file uploads
        proxy_read_timeout 120s;
    }
}
