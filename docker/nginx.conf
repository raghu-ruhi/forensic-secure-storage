server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser hardening. A Content-Security-Policy is deliberately NOT set yet: it must allow the API origin
    # and blob: frames for the PDF/image preview, and could not be tested in a real browser here (see
    # docs/SECURITY_REPORT.md, finding F-10).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # SPA fallback: send all unmatched routes to index.html so
        # React Router can handle client-side navigation.
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
